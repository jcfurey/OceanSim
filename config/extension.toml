[core]
reloadable = true
order = 0

[package]
version = "1.0.0"
category = "Simulation"
title = "OceanSim"
description = "Underwater simulation utilities"
authors = ["FRoG--University of Michigan"]
repository = ""
keywords = ["Underwater","Sensor","Scene"]
changelog = "docs/CHANGELOG.md"
readme = "docs/README.md"
preview_image = "data/preview.png"
icon = "data/icon.png"

[fswatcher.patterns]
include = ["*.ogn", "*.py"]
exclude = ["Ogn*Database.py"]

# Dependencies use the Isaac Sim 6.x extension ids the code actually imports
# (isaacsim.gui.components / isaacsim.core.* / isaacsim.examples.extension);
# omni.isaac.ui / omni.isaac.core were the pre-6.0 names of these extensions.
# All of these still exist in Isaac Sim 6.1.0 (several as deprecated-since-6.0
# extensions that isaacsim.exp.base.kit still enables). A wrong extension id
# fails dependency resolution at enable time, so keep this list in sync with the
# imports.
[dependencies]
"omni.kit.uiapp" = {}
"isaacsim.gui.components" = {}
"isaacsim.core.prims" = {}
"isaacsim.core.utils" = {}
"isaacsim.examples.extension" = {}


[[python.module]]
name = "isaacsim.oceansim.modules.SensorExample_python"

[[python.module]]
name = "isaacsim.oceansim.modules.colorpicker_python"

[[python.module]]
name = "isaacsim.oceansim.modules.trajRecorder_python"

[[python.module]]
name = "isaacsim.oceansim.modules.SDGplayground_python"

[[python.module]]
name = "isaacsim.oceansim"
